<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chicken Nugget Tycoon</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #fff8e1;
      padding: 20px;
    }
    h1 {
      color: #d2691e;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
    }
    #stats {
      margin: 20px 0;
    }
    .customer {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 10px;
      margin: 10px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>🐔 Chicken Nugget Tycoon 🍗</h1>
  <div id="stats">
    <p><strong>Nuggets:</strong> <span id="nuggets">0</span></p>
    <p><strong>Money:</strong> $<span id="money">0</span></p>
    <p><strong>Click Power:</strong> <span id="clickPower">1</span></p>
    <p><strong>Auto Nuggets/sec:</strong> <span id="autoNuggets">0</span></p>
    <div id="dinoStats" style="display:none;">
      <p><strong>Dino Nuggets:</strong> <span id="dinoNuggets">0</span></p>
    </div>
    <div id="friesStats" style="display:none;">
      <p><strong>French Fries:</strong> <span id="frenchFries">0</span></p>
    </div>
  </div>

  <button onclick="makeNugget()">Make Nugget</button><br>
  <button onclick="upgradeClick()">Upgrade Click ($<span id="upgradeCost">10</span>)</button><br>
  <button onclick="buyAuto()">Buy Nugget Maker ($<span id="autoCost">50</span>)</button><br><br>

  <button id="unlockDinoBtn" onclick="unlockDinoNuggets()">🦕 Unlock Dino Nuggets ($10,000)</button>
  <div id="dinoSection" style="display:none;">
    <button onclick="makeDinoNugget()">Make Dino Nugget (50 Nuggets)</button>
    <button onclick="sellDinoNuggets()">Sell Dino Nuggets ($100 each)</button>
    <button onclick="buyAutoDino()">Buy Auto Dino Maker ($<span id="autoDinoCost">10000</span>)</button>
  </div><br>

  <button id="unlockFriesBtn" onclick="unlockFrenchFries()">🍟 Unlock French Fries ($1000)</button>
  <div id="friesSection" style="display:none;">
    <button onclick="makeFrenchFries()">Make French Fry (1 Nugget)</button>
    <button onclick="sellFrenchFries()">Sell French Fries ($10 each)</button>
    <button onclick="buyAutoFries()">Buy Auto Fry Maker ($<span id="autoFriesCost">5000</span>)</button>
  </div><br>

  <div id="customerArea"></div>

  <button onclick="saveGame()">💾 Save Game</button>
  <button onclick="loadGame()">📂 Load Game</button>
  <button onclick="resetGame()">❌ Reset</button>

  <script>
    let nuggets = 0;
    let money = 0;
    let clickPower = 1;
    let autoNuggets = 0;
    let upgradeCost = 10;
    let autoCost = 50;

    // Dino Nuggets
    let dinoUnlocked = false;
    let dinoNuggets = 0;
    let autoDino = 0;
    let autoDinoCost = 10000;

    // French Fries
    let friesUnlocked = false;
    let frenchFries = 0;
    let autoFries = 0;
    let autoFriesCost = 5000;

    function updateDisplay() {
      document.getElementById('nuggets').textContent = nuggets;
      document.getElementById('money').textContent = money;
      document.getElementById('clickPower').textContent = clickPower;
      document.getElementById('autoNuggets').textContent = autoNuggets;

      if (dinoUnlocked) {
        document.getElementById('dinoStats').style.display = 'block';
        document.getElementById('dinoSection').style.display = 'block';
        document.getElementById('unlockDinoBtn').style.display = 'none';
        document.getElementById('autoDinoCost').textContent = autoDinoCost;
      }

      if (friesUnlocked) {
        document.getElementById('friesStats').style.display = 'block';
        document.getElementById('friesSection').style.display = 'block';
        document.getElementById('unlockFriesBtn').style.display = 'none';
        document.getElementById('autoFriesCost').textContent = autoFriesCost;
      }

      document.getElementById('dinoNuggets').textContent = dinoNuggets;
      document.getElementById('frenchFries').textContent = frenchFries;
      document.getElementById('upgradeCost').textContent = upgradeCost;
      document.getElementById('autoCost').textContent = autoCost;
    }

    function makeNugget() {
      nuggets += clickPower;
      updateDisplay();
    }

    function upgradeClick() {
      if (money >= upgradeCost) {
        money -= upgradeCost;
        clickPower += 1;
        upgradeCost = Math.floor(upgradeCost * 1.5);
        updateDisplay();
      } else {
        alert("Not enough money!");
      }
    }

    function buyAuto() {
      if (money >= autoCost) {
        money -= autoCost;
        autoNuggets += 1;
        autoCost = Math.floor(autoCost * 2);
        updateDisplay();
      } else {
        alert("Not enough money!");
      }
    }

    function buyAutoDino() {
      if (money >= autoDinoCost) {
        money -= autoDinoCost;
        autoDino += 1;
        autoDinoCost = Math.floor(autoDinoCost * 1.5);
        updateDisplay();
      } else {
        alert("Not enough money for Auto Dino Maker!");
      }
    }

    function buyAutoFries() {
      if (money >= autoFriesCost) {
        money -= autoFriesCost;
        autoFries += 1;
        autoFriesCost = Math.floor(autoFriesCost * 1.5);
        updateDisplay();
      } else {
        alert("Not enough money for Auto Fry Maker!");
      }
    }

    setInterval(() => {
      nuggets += autoNuggets;

      // Auto-produce Dino Nuggets
      if (dinoUnlocked && nuggets >= 50 * autoDino) {
        nuggets -= 50 * autoDino;
        dinoNuggets += autoDino;
      }

      // Auto-produce French Fries
      if (friesUnlocked && nuggets >= autoFries) {
        nuggets -= autoFries;
        frenchFries += autoFries;
      }

      updateDisplay();
    }, 1000);

    function unlockDinoNuggets() {
      if (money >= 10000) {
        money -= 10000;
        dinoUnlocked = true;
        updateDisplay();
        alert("Dino Nuggets unlocked!");
      } else {
        alert("You need $10,000 to unlock Dino Nuggets!");
      }
    }

    function makeDinoNugget() {
      if (nuggets >= 50) {
        nuggets -= 50;
        dinoNuggets += 1;
        updateDisplay();
      } else {
        alert("Not enough nuggets to make a Dino Nugget (Need 50).");
      }
    }

    function sellDinoNuggets() {
      if (dinoNuggets > 0) {
        money += dinoNuggets * 100;
        dinoNuggets = 0;
        updateDisplay();
      } else {
        alert("No Dino Nuggets to sell!");
      }
    }

    function unlockFrenchFries() {
      if (money >= 1000) {
        money -= 1000;
        friesUnlocked = true;
        updateDisplay();
        alert("French Fries unlocked!");
      } else {
        alert("You need $1000 to unlock French Fries!");
      }
    }

    function makeFrenchFries() {
      if (nuggets >= 1) {
        nuggets -= 1;
        frenchFries += 1;
        updateDisplay();
      } else {
        alert("Not enough nuggets to make French Fries (Need 1).");
      }
    }

    function sellFrenchFries() {
      if (frenchFries > 0) {
        money += frenchFries * 10;
        frenchFries = 0;
        updateDisplay();
      } else {
        alert("No French Fries to sell!");
      }
    }

    function spawnCustomer() {
      const customer = document.createElement("div");
      customer.className = "customer";
      const demandNuggets = Math.floor(Math.random() * 5) + 1;
      let demandFries = 0;
      let demandDino = 0;

      if (friesUnlocked) demandFries = Math.floor(Math.random() * 3);
      if (dinoUnlocked) demandDino = Math.floor(Math.random() * 2);

      const price = (demandNuggets * 2) + (demandFries * 10) + (demandDino * 100);

      customer.innerHTML = `
        <p>A customer wants:</p>
        <ul>
          <li><strong>${demandNuggets}</strong> Nuggets</li>
          <li><strong>${demandFries}</strong> French Fries</li>
          <li><strong>${demandDino}</strong> Dino Nuggets</li>
        </ul>
        <p>Total Price: $${price}</p>
        <button onclick="sellToCustomer(this, ${demandNuggets}, ${demandFries}, ${demandDino}, ${price})">Sell</button>
      `;
      document.getElementById("customerArea").appendChild(customer);

      setTimeout(() => customer.remove(), 10000);
    }

    setInterval(() => {
      for (let i = 0; i < 3; i++) spawnCustomer();
    }, 7000);

    function sellToCustomer(button, demandNuggets, demandFries, demandDino, price) {
      if (nuggets >= demandNuggets && frenchFries >= demandFries && dinoNuggets >= demandDino) {
        nuggets -= demandNuggets;
        frenchFries -= demandFries;
        dinoNuggets -= demandDino;
        money += price;
        updateDisplay();
        button.parentNode.remove();
      } else {
        alert("Not enough items to sell to this customer!");
      }
    }

    function saveGame() {
      const data = {
        nuggets, money, clickPower, autoNuggets, upgradeCost, autoCost,
        dinoUnlocked, dinoNuggets, autoDino, autoDinoCost,
        friesUnlocked, frenchFries, autoFries, autoFriesCost
      };
      localStorage.setItem('nuggetSave', JSON.stringify(data));
      alert("Game saved!");
    }

    function loadGame() {
      const save = localStorage.getItem('nuggetSave');
      if (save) {
        const data = JSON.parse(save);
        nuggets = data.nuggets || 0;
        money = data.money || 0;
        clickPower = data.clickPower || 1;
        autoNuggets = data.autoNuggets || 0;
        upgradeCost = data.upgradeCost || 10;
        autoCost = data.autoCost || 50;
        dinoUnlocked = data.dinoUnlocked || false;
        dinoNuggets = data.dinoNuggets || 0;
        autoDino = data.autoDino || 0;
        autoDinoCost = data.autoDinoCost || 10000;
        friesUnlocked = data.friesUnlocked || false;
        frenchFries = data.frenchFries || 0;
        autoFries = data.autoFries || 0;
        autoFriesCost = data.autoFriesCost || 5000;
        updateDisplay();
        alert("Game loaded!");
      } else {
        alert("No saved game found.");
      }
    }

    function resetGame() {
      if (confirm("Reset all progress?")) {
        nuggets = 0;
        money = 0;
        clickPower = 1;
        autoNuggets = 0;
        upgradeCost = 10;
        autoCost = 50;
        dinoUnlocked = false;
        dinoNuggets = 0;
        autoDino = 0;
        autoDinoCost = 10000;
        friesUnlocked = false;
        frenchFries = 0;
        autoFries = 0;
        autoFriesCost = 5000;
        localStorage.removeItem('nuggetSave');
        updateDisplay();
      }
    }

    window.onload = () => {
      loadGame();
      updateDisplay();
    };
  </script>
</body>
</html>
